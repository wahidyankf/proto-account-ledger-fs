# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.5.0/schemas/repo-config/v2.schema.json
schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - .nx
    - node_modules
    - local-tmp
    - generated-reports
    - dist

harness:
  canonical:
    agents:
      name: name
      description: description
      grants: requires
      denials: denies
      constraints: constraints
    skills:
      name: name
      description: description
  requirements:
    capabilities: [repository-read, repository-write, shell]
    constraints: []
    routes: [canonical-import]
    identities: [description]
  profiles:
    - id: claude
      supports:
        capabilities: [repository-read, repository-write, shell]
        constraints: []
        routes: [canonical-import]
        identities: [description]
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route:
          "Before acting, read the complete canonical agent definition at the
          repository-root path {path} and follow it as authoritative. If it
          cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        fixed: { model: inherit }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: denies,
              capability: repository-write,
              field: tools,
              absent-members: [Write, Edit],
            }
          - {
              when: denies,
              capability: shell,
              field: tools,
              absent-members: [Bash, PowerShell],
            }
          - {
              when: denies,
              capability: nested-agent,
              field: tools,
              absent-members: [Agent, Task],
            }
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route:
          "Read {path} completely, resolve every relative resource from that
          skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
    - id: codex
      supports:
        capabilities: [repository-read, repository-write, shell]
        constraints: []
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route:
          "Before acting, read the complete canonical agent definition at the
          repository-root path {path} and follow it as authoritative. If it
          cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        fixed: { sandbox_mode: read-only }
        absent: [model]
    - id: opencode
      supports:
        capabilities: [repository-read, repository-write, shell]
        constraints: []
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route:
          "Before acting, read the complete canonical agent definition at the
          repository-root path {path} and follow it as authoritative. If it
          cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: denies,
              capability: repository-write,
              field: permission,
              entries: { edit: deny },
            }
          - {
              when: denies,
              capability: shell,
              field: permission,
              entries: { bash: deny },
            }
          - {
              when: denies,
              capability: nested-agent,
              field: permission,
              entries: { task: deny },
            }

policies:
  markdown:
    metadata:
      surfaces:
        - { glob: "repo-governance/**/*.md", schema: governance }
        - { glob: "repo-governance/workflows/**/*.md", schema: workflow }
        - { glob: ".agents/skills/*/SKILL.md", schema: skill }
        - { glob: ".agents/agents/*.md", schema: agent }
        - { glob: ".agents/**/README.md", schema: governance }
    heading-hierarchy:
      surfaces:
        - { glob: "**/*.md" }
      single-h1: true
      max-level-jump: 1
    naming:
      surfaces:
        - { glob: "**/*.md", style: kebab-case }
      exempt:
        - "**/README.md"
        - "**/SKILL.md"
        - "AGENTS.md"
        - "CLAUDE.md"
        # Assessment deliverables whose upper-case names are prescribed.
        - "NUMBERS.md"
        - "AMBIGUITIES.md"
        - "REJECTED.md"
        - "WORKLOG.md"
    internal-link:
      exclude-sources: ["specs/fixtures/**"]
  governance:
    word-budget:
      count: whitespace-separated
      surfaces:
        - { glob: "AGENTS.md", fail: 750 }
        - { glob: "CLAUDE.md", fail: 750 }
        - { glob: "repo-governance/**/*.md", fail: 750 }
        - { glob: ".agents/README.md", fail: 750 }
        - { glob: ".claude/README.md", fail: 750 }
        - { glob: ".codex/README.md", fail: 750 }
        - { glob: ".opencode/README.md", fail: 750 }
    directory-map:
      trees:
        - { path: repo-governance }
        - { path: plans }
        - { path: specs }
        - { path: docs }

gates:
  composition:
    pull-request: { relation: exact }
  entries:
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
      run-on: { pre-commit: {}, pre-push: {}, pull-request: {}, main: {} }
    - id: public-safety-commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args:
          - { literal: scripts/public-safety/check-commit-message }
          - { input: message.text, expand: single }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/tests/run.sh }]
      run-on: { main: {} }
    - id: commitlint
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: ./scripts/validate-commit-message
        args: [{ input: message.text, expand: single }]
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: format-staged
      type: mutation
      inputs:
        staged: { kind: files }
      mutation: { local: apply-index, ci: verify-clean }
      command:
        executable: ./scripts/format-staged
        args: [{ input: staged.paths, expand: repeat }]
      run-on:
        pre-commit:
          bind:
            staged: { source: git-index }
        pull-request:
          bind:
            staged: { source: explicit-range, range: explicit }
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args: [{ literal: repo-config }, { literal: validate }]
      run-on: { main: {} }
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: word-budget },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: directory-map
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: directory-map },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: metadata
      type: check
      command:
        executable: ./rhino
        args: [{ literal: metadata }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: naming
      type: check
      command:
        executable: ./rhino
        args: [{ literal: md }, { literal: naming }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: heading-hierarchy
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: md },
            { literal: heading-hierarchy },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: harness }, { literal: adapters }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: internal-link
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: md }, { literal: internal-link }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
