# The values decide nothing: they know no rule, so nothing here reaches the aggregate, the ledger, or anything above.
extend = "../../../../pyproject.toml"

[lint]
extend-select = ["TID251"]

[lint.flake8-tidy-imports.banned-api]
"account_ledger.domain.account".msg = "a value never imports the account aggregate"
"account_ledger.domain.ledger".msg = "a value never imports the ledger service"
"account_ledger.domain.report".msg = "a value never imports the report"
"account_ledger.domain.stream_processing".msg = "a value never imports the stream processing"
"account_ledger.adapters".msg = "the domain never imports an adapter; the shell composes them"
"account_ledger.cli".msg = "the domain never imports the shell"
