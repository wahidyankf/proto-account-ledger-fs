[project]
name = "account-ledger-cli"
version = "0.1.0"
description = "An in-memory account ledger core, exercised through a command-line entry point."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "pytest-watcher>=0.4",
  "ruff>=0.16.8",
  "vulture>=2.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src", "tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "C901", "PLR1702", "D1"]
# A magic method's meaning is Python's own; pylint's no-docstring-rgx skips it too.
ignore = ["D105"]
# OUTPUT_TARGET and the brief print negative amounts with U+2212, so the report and verbatim quotes need it.
allowed-confusables = ["−"]
# PLR1702 is still a preview rule; explicit-preview-rules keeps every other preview rule off.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 3

# ruff's D1 checks public names only; pylint's three docstring checks hold private names to a docstring too. Only
# magic methods, whose meaning is Python's own, are exempt. invalid-name holds every name to its style, and every
# function to a verb and its object; see Naming in the Python standards.
[tool.pylint."messages control"]
disable = ["all"]
enable = ["missing-module-docstring", "missing-class-docstring", "missing-function-docstring", "invalid-name"]

[tool.pylint.basic]
no-docstring-rgx = "^__.+__$"
docstring-min-length = -1
# A function starts with a verb from this list and names its object after it; a method may leave the object to its
# class, as `Day.parse` does. A new verb joins the list in the change that first needs it.
function-rgx = "^_?(accrue|add|advance|append|apply|assess|build|capitalize|check|close|compute|count|decide|describe|fail|find|flush|format|generate|get|has|interrupt|is|list|load|make|map|open|parse|process|publish|read|record|remove|render|require|round|run|save|select|span|split|sum|take|tap|test|try|unwrap|update|validate|write)(_[a-z0-9]+)+$"
method-rgx = "^(__[a-z0-9_]+__|_?(accrue|add|advance|append|apply|assess|build|capitalize|check|close|compute|count|decide|describe|fail|find|flush|format|generate|get|has|interrupt|is|list|load|make|map|open|parse|process|publish|read|record|remove|render|require|round|run|save|select|span|split|sum|take|tap|test|try|unwrap|update|validate|write)(_[a-z0-9]+)*)$"
# `main` is Python's entry-point name, as `__main__.py` calls it; `flat_map` and `flat_map_err` are the Result
# combinators' conventional names.
good-names = ["main", "_", "flat_map", "flat_map_err"]
# A class or type alias never starts with `Any`, which reads as `typing.Any`; a union over the currencies takes the plain
# noun, as `Money` does.
class-rgx = '^(?!_?Any[A-Z])_?[^\W\da-z][^\W_]*$'
typealias-rgx = '^(?!_?Any[A-Z])_?[A-Z][A-Za-z0-9]*$'

[tool.pylint.reports]
score = false

# vulture reads src and tests together, so code nothing calls fails lint; ruff and pyright see one module at a time.
[tool.vulture]
paths = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
# The module entry point only hands `main` to the interpreter; everything it calls is measured.
omit = ["*/account_ledger/__main__.py"]
