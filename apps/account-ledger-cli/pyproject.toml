[project]
name = "account-ledger-cli"
version = "0.1.0"
description = "An in-memory account ledger core, exercised through a command-line entry point."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1",
  "pytest-bdd>=8.1",
  "pytest-cov>=7.0",
  "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src", "tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
xfail_strict = true
# Every test level binds the same Gherkin files, kept in the repository's root specification tree.
bdd_features_base_dir = "../../specs/apps/account-ledger/cli/behaviours"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
# The module entry point only hands `main` to the interpreter; everything it calls is measured.
omit = ["*/account_ledger/__main__.py"]
